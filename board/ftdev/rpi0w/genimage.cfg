image boot.vfat {
  vfat {
    files = {
      "custom/bootcode.bin",
      "custom/cmdline.txt",
      "custom/config.txt",
      "custom/start.elf",
      "custom/fixup.dat",
      "custom/bcm2708-rpi-0-w.dtb",
      "custom/kernel.img",
      "custom/zImage"
    }
  }
  size = 16M
}

image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}
